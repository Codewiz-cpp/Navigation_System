<!DOCTYPE html>
<html>
<head>
  <title>Indoor Navigation 3D</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      border-radius: 6px;

      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="app.js"></script>

</html>
