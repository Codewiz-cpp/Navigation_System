<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Indoor Nav</title>
 
  <!--
    importmap MUST come before any module script.
    Maps bare "three" and "three/addons/" to jsdelivr URLs.
    OrbitControls & GLTFLoader internally import from "three" —
    without this they fail even if app.js uses full URLs.
  -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
 
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#08101e;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#c8e0ff}
    canvas{display:block}
 
    /* LOADER */
    #loader{
      position:fixed;inset:0;background:#08101e;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:999;transition:opacity .6s;
    }
    #loader .logo{font-size:1.1rem;letter-spacing:.25em;color:#00d4ff;text-transform:uppercase;margin-bottom:28px}
    .bar-wrap{width:220px;height:3px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ffaa);animation:fillBar 2.5s ease-out forwards}
    @keyframes fillBar{to{width:90%}}
    #loadPct{margin-top:12px;font-size:.78rem;color:rgba(200,224,255,.5);letter-spacing:.1em}
 
    /* HUD */
    #hud{
      position:fixed;top:14px;left:14px;
      background:rgba(8,16,30,.85);border:1px solid rgba(0,200,255,.22);
      border-radius:10px;padding:12px 16px;backdrop-filter:blur(8px);
      min-width:200px;pointer-events:none;z-index:50;
    }
    #hud h3{font-size:.7rem;letter-spacing:.18em;color:#00d4ff;text-transform:uppercase;
      margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,200,255,.15)}
    .hud-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:5px;font-size:.78rem}
    .hud-label{color:rgba(200,224,255,.45)}
    .hud-val{color:#e0f4ff;font-variant-numeric:tabular-nums}
    .anchor{color:#ffaa00;font-size:.72rem}
 
    /* PANEL */
    #panel{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:50}
    .btn-group{
      display:flex;gap:5px;
      background:rgba(8,16,30,.85);border:1px solid rgba(0,200,255,.18);
      border-radius:9px;padding:6px;backdrop-filter:blur(8px);
    }
    .btn{
      background:transparent;color:rgba(200,224,255,.6);
      border:1px solid rgba(0,200,255,.18);border-radius:7px;
      padding:7px 13px;font-size:.78rem;cursor:pointer;transition:all .18s;white-space:nowrap;
    }
    .btn:hover{background:rgba(0,200,255,.1);color:#e0f4ff;border-color:rgba(0,200,255,.4)}
    .btn.active{background:rgba(0,200,255,.2);color:#00d4ff;border-color:#00d4ff}
    .btn.danger{color:rgba(255,100,100,.7);border-color:rgba(255,100,100,.2)}
    .btn.danger:hover{background:rgba(255,80,80,.12);color:#ff6666;border-color:rgba(255,100,100,.5)}
 
    /* FLOOR BUTTONS */
    #floors{
      position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
      display:flex;gap:6px;
      background:rgba(8,16,30,.88);border:1px solid rgba(0,200,255,.18);
      border-radius:40px;padding:7px 12px;backdrop-filter:blur(10px);z-index:50;
    }
    .floor-btn{
      background:transparent;color:rgba(200,224,255,.5);
      border:1px solid rgba(0,200,255,.15);border-radius:30px;
      padding:6px 18px;font-size:.8rem;cursor:pointer;transition:all .18s;
    }
    .floor-btn:hover{background:rgba(0,200,255,.08);color:#c8e0ff}
    .floor-btn.active{background:rgba(0,200,255,.2);color:#00d4ff;border-color:#00d4ff;font-weight:600}
 
    /* LEGEND */
    #legend{
      position:fixed;bottom:18px;left:14px;
      background:rgba(8,16,30,.78);border:1px solid rgba(0,200,255,.14);
      border-radius:9px;padding:10px 14px;
      font-size:.72rem;line-height:1.9;color:rgba(200,224,255,.5);
      pointer-events:none;z-index:50;backdrop-filter:blur(6px);
    }
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
 
    /* TOAST */
    #toast{
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);
      background:rgba(0,20,40,.9);border:1px solid rgba(0,200,255,.35);
      border-radius:30px;padding:9px 22px;
      font-size:.82rem;color:#c8e0ff;
      opacity:0;pointer-events:none;
      transition:opacity .3s,transform .3s;
      z-index:100;white-space:nowrap;backdrop-filter:blur(8px);
    }
  </style>
</head>
<body>
 
  <div id="loader">
    <div class="logo">Indoor Navigation</div>
    <div class="bar-wrap"><div class="bar-fill"></div></div>
    <div id="loadPct">Initialising…</div>
  </div>
 
  <div id="hud">
    <h3>📍 Position</h3>
    <div id="hudContent"></div>
  </div>
 
  <div id="panel">
    <div class="btn-group">
      <button class="btn active" id="btnOverview">🗺 Overview</button>
      <button class="btn"        id="btnOrbit">🔄 Orbit</button>
      <button class="btn"        id="btnPOV">👁 POV</button>
    </div>
    <div class="btn-group">
      <button class="btn"        id="btnNav">📍 Navigate</button>
      <button class="btn danger" id="btnClear">✕ Clear</button>
    </div>
    <div class="btn-group">
      <button class="btn"        id="btnWifi">📡 WiFi Fix</button>
    </div>
  </div>
 
  <div id="floors">
    <button class="floor-btn"        data-floor="0">↓ Lower</button>
    <button class="floor-btn active" data-floor="1">🏠 Mine</button>
    <button class="floor-btn"        data-floor="2">↑ Upper</button>
  </div>
 
  <div id="legend">
    <span class="dot" style="background:#00d4ff"></span>Walls &nbsp;
    <span class="dot" style="background:#ff3333"></span>You &nbsp;
    <span class="dot" style="background:#ffaa00"></span>Your router &nbsp;
    <span class="dot" style="background:#ff6622"></span>Neighbour router<br>
    <span class="dot" style="background:#00ffaa"></span>Path / Beacon &nbsp;
    <span class="dot" style="background:#ffff00"></span>Destination<br>
    <b style="color:rgba(200,224,255,.35)">WASD / ↑↓←→</b> Move &nbsp;
    <b style="color:rgba(200,224,255,.35)">1 2 3</b> Views &nbsp;
    <b style="color:rgba(200,224,255,.35)">N</b> Navigate
  </div>
 
  <div id="toast"></div>
 
  <!-- type="module" required for ES imports in app.js -->
  <script type="module" src="app.js"></script>
 
</body>
</html>
